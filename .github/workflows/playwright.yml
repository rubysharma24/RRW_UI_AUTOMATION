name: PayPal Checkout Test

on:
  workflow_dispatch:        # GitHub me "Run workflow" button se manually chalane ke liye
  push:
    branches: [roadready_ui_automation]

jobs:
  paypal-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Run PayPal test
        run: npx playwright test tests/Paypalcheckout.spec.ts --project=chromium

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
