name: Playwright Automation

on:
  push:
    branches: [roadready_ui_automation]
  workflow_dispatch:
jobs:
  run-playwright-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium firefox webkit msedge

      - name: Run Playwright Tests
        run: npx playwright test

      - name: Zip Report
        if: always()
        run: zip -r playwright-report.zip playwright-report/

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Send Email Report
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Playwright Report - ${{ job.status }} (${{ github.ref_name }})"
          to: ${{ secrets.MAIL_TO }}
          from: RoadReadyWheels QA <${{ secrets.MAIL_USERNAME }}>
          body: |
            Playwright test run complete.

            Status: ${{ job.status }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            HTML report attached (unzip and open index.html).
          attachments: playwright-report.zip
